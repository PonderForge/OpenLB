[package]
name = "openlb"
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
description = "A high-speed Sexual Image classifier and filtering library"
repository = "https://github.com/PonderForge/OpenLB"
readme = "README.md"
keywords = ["nsfw", "onnx", "transformers", "ai", "image"]
categories = ["text-processing", "multimedia::images", "computer-vision"]

[dependencies]
ort = { version = "=2.0.0-rc.8", default-features = false, features = ["load-dynamic", "half", "ndarray"]}
ort-sys = { version = "=2.0.0-rc.8"}
geo = { version = "0.29.3", optional = true }
ndarray = "0.16.1"
bincode = { version = "2.0.1", optional = true }
gif = { version = "0.13.1", optional = true }
tokenizers = { version = "0.22.0", default-features = false, features = ["fancy-regex"], optional = true }
fancy-regex = { version = "0.16.2", optional = true }
image = { version = "0.25.8", optional = true }
nshare = { version = "0.10.0", optional = true }
fast_image_resize = { version = "5.3.0", features = ["image"] }

[features]
default = ["image_scan", "text_scan"]
bincode=["dep:bincode"]
gif=["dep:gif"]
image_scan = ["dep:image", "dep:geo", "dep:nshare"]
text_scan = ["dep:tokenizers", "dep:fancy-regex"]

[profile.dev]
opt-level = 1
